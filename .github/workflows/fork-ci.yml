name: Fork CI
on:
  pull_request:
    branches: [work]
  push:
    branches: [work]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'leejongyoung/egovframe-common-components'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify full build without running tests
        run: mvn -B -ntp verify --file pom.xml -DskipTests
      - name: Run selected pure tests without a database
        run: >-
          mvn -B -ntp test --file pom.xml -DskipTests=false -Ptest
          -Dtest='TestCopyCollections,TestSessionURLPattern,TestWhiteListLink,BlogTest_JavaParser,EgovArticleDAOTest_JavaParser,EgovArticleServiceImplTest_deleteArticleGuard,EgovArticleServiceImplTest_selectArticleDetailCn_getResultMap,EgovArticleServiceImplTest_selectArticleDetailDefault_getResultMap,EgovArticleServiceImplTest_selectNoticeArticleList_MyBatis,EgovArticleServiceImplTest_updateArticle_MyBatis,TestRegistAdministCodeNPlus1,TestRegistInsttCodeNPlus1,TestMessage,TestPropertyPath,EgovSecurityConfigTest,EgovHtmlSanitizerGoldenTest,AuthenticInterceptorTest,EgovSysHistoryServiceImplTest'
          -DfailIfNoTests=false
