name: Fork CI
on:
  pull_request:
    branches: [work]
  push:
    branches: [work]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'leejongyoung/egovframe-common-components'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test fork issue auto-close policy offline
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # 서비스 컨테이너는 mysqld 인자를 줄 수 없다. DDL 은 대문자 테이블명을 만들고 매퍼 SQL 은 소문자를
      # 쓰므로(Linux 기본 lower_case_table_names=0 에서는 not found) 직접 띄워 1 로 설정한다.
      - name: Start MySQL (lower_case_table_names=1)
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=com \
            -e MYSQL_USER=com -e MYSQL_PASSWORD=com01 \
            mysql:8.0 --lower-case-table-names=1 --character-set-server=utf8mb4
          for i in $(seq 1 60); do
            if docker exec mysql mysql -uroot -proot -e "select 1" >/dev/null 2>&1; then
              echo "MySQL is ready"; exit 0
            fi
            sleep 2
          done
          docker logs mysql; exit 1
      - name: Initialize MySQL schema and seed data
        run: |
          docker exec -i mysql mysql -uroot -proot --default-character-set=utf8mb4 com < script/ddl/mysql/com_DDL_mysql.sql
          docker exec -i mysql mysql -uroot -proot --default-character-set=utf8mb4 com < script/dml/mysql/com_DML_mysql.sql
      - name: Verify full build without running tests
        run: mvn -B -ntp verify --file pom.xml -DskipTests
      - name: Run selected pure tests without a database
        run: >-
          mvn -B -ntp test --file pom.xml -DskipTests=false -Ptest
          -Dtest='TestCopyCollections,TestSessionURLPattern,TestWhiteListLink,BlogTest_JavaParser,EgovArticleDAOTest_JavaParser,EgovArticleServiceImplTest_deleteArticleGuard,EgovArticleServiceImplTest_selectArticleDetailCn_getResultMap,EgovArticleServiceImplTest_selectArticleDetailDefault_getResultMap,EgovArticleServiceImplTest_selectNoticeArticleList_MyBatis,EgovArticleServiceImplTest_updateArticle_MyBatis,TestRegistAdministCodeNPlus1,TestRegistInsttCodeNPlus1,TestMessage,TestPropertyPath,EgovSecurityConfigTest,EgovHtmlSanitizerGoldenTest,AuthenticInterceptorTest,EgovSysHistoryServiceImplTest'
          -DfailIfNoTests=false
      # EgovComIndexControllerTest#test4setContent 는 다른 테스트가 남긴 SecurityContext(로그인 사용자)에 의존해
      # 실행 순서에 따라 결과가 달라진다(별도 이슈로 추적). 나머지는 모두 실행한다.
      - name: Run DB-dependent tests
        run: >-
          mvn -B -ntp test --file pom.xml -DskipTests=false -Ptest -DfailIfNoTests=false
          -Dtest='!EgovComIndexControllerTest#test4setContent'
          -DGlobals.mysql.Url="jdbc:mysql://127.0.0.1:3306/com?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8"
          -DGlobals.mysql.UserName=com
          -DGlobals.mysql.Password=com01
          -DGlobals.mysql.DriverClassName=com.mysql.cj.jdbc.Driver
