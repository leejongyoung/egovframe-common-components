name: Fork CI
on:
  pull_request:
    branches: [work]
  push:
    branches: [work]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'leejongyoung/egovframe-common-components'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify full build without running tests
        run: mvn -B -ntp verify --file pom.xml -DskipTests
      - name: Run selected pure tests without a database
        run: >-
          mvn -B -ntp test --file pom.xml -DskipTests=false -Ptest
          -Dtest='TestCopyCollections,TestSessionURLPattern,EgovArticleServiceImplTest_deleteArticleGuard,TestRegistAdministCodeNPlus1,TestRegistInsttCodeNPlus1,EgovHtmlSanitizerGoldenTest'
          -DfailIfNoTests=false
